type Query {
  ping: String!
  viewer: Viewer
  loginIdAvailability(loginId: String!): LoginIdAvailability!
  parts: [Part!]!
  generations: [GenerationOption!]!
  generationInvitationCode(generationNumber: Int!): GenerationInvitationCode!
  sessions(generationNumber: Int!): [Session!]!
  sessionAttendances(
    sessionId: ID!
    attendanceStatus: AttendanceStatus
    part: Part
    nickname: String
    page: Int!
    size: Int!
  ): SessionAttendancePage!
}

type Mutation {
  createGeneration(input: CreateGenerationInput!): Generation!
  createSession(input: CreateSessionInput!): Session!
  updateSession(input: UpdateSessionInput!): Session!
  deleteSession(input: DeleteSessionInput!): DeleteSessionPayload!
  updateSessionAttendanceStatus(input: UpdateSessionAttendanceStatusInput!): SessionAttendance!
  updateSessionAttendanceNote(input: UpdateSessionAttendanceNoteInput!): SessionAttendance!
  signUp(input: SignUpInput!): SignUpPayload!
  login(input: LoginInput!): AuthPayload!
  refreshToken(input: RefreshTokenInput!): AuthPayload!
}

type Viewer {
  userId: ID!
  loginId: String!
  name: String!
  nickname: String!
  part: Part!
  role: Role!
}

type LoginIdAvailability {
  loginId: String!
  available: Boolean!
}

type Generation {
  id: ID!
  number: Int!
  invitationCode: String!
}

type GenerationOption {
  id: ID!
  number: Int!
  startDate: String
  endDate: String
}

type GenerationInvitationCode {
  id: ID!
  number: Int!
  invitationCode: String!
}

type Session {
  id: ID!
  generation: GenerationSummary!
  sessionName: String!
  description: String
  placeName: String!
  latitude: Float!
  longitude: Float!
  sessionDate: String!
  startTime: String!
  endTime: String!
  attendanceStartTime: String!
  attendanceEndTime: String!
  attendanceStatus: AttendanceStatus
  createdBy: String!
  updatedBy: String!
  createdAt: String!
  updatedAt: String!
}

type SessionAttendance {
  name: String!
  nickname: String!
  loginId: String!
  part: Part!
  team: String
  attendanceStatus: AttendanceStatus!
  updatedAt: String!
  updatedBy: String!
  note: String
}

type SessionAttendancePage {
  items: [SessionAttendance!]!
  pageInfo: PageInfo!
}

type PageInfo {
  page: Int!
  size: Int!
  totalElements: Int!
  totalPages: Int!
  hasNext: Boolean!
  hasPrevious: Boolean!
}

type AuthPayload {
  tokenType: String!
  accessToken: String!
  refreshToken: String!
  accessTokenExpiresAt: String!
  refreshTokenExpiresAt: String!
  loginId: String!
  name: String!
  nickname: String!
  part: Part!
  role: Role!
  generation: GenerationSummary
  team: TeamSummary
}

type GenerationSummary {
  id: ID!
  number: Int!
}

type TeamSummary {
  id: ID!
  name: String!
}

type SignUpPayload {
  userId: ID!
  loginId: String!
  name: String!
  nickname: String!
  part: Part!
  role: Role!
  generation: GenerationSummary!
  team: TeamSummary
}

type DeleteSessionPayload {
  deletedSessionId: ID!
  deleted: Boolean!
}

input CreateGenerationInput {
  number: Int!
  invitationCode: String!
  startDate: String
  endDate: String
}

input CreateSessionInput {
  generationNumber: Int!
  sessionName: String!
  description: String
  placeName: String!
  latitude: Float!
  longitude: Float!
  sessionDate: String!
  startTime: String!
  endTime: String!
  attendanceStartTime: String!
  attendanceEndTime: String!
}

input UpdateSessionInput {
  sessionId: ID!
  sessionName: String!
  description: String
  placeName: String!
  latitude: Float!
  longitude: Float!
  sessionDate: String!
  startTime: String!
  endTime: String!
  attendanceStartTime: String!
  attendanceEndTime: String!
}

input DeleteSessionInput {
  sessionId: ID!
}

input UpdateSessionAttendanceStatusInput {
  sessionId: ID!
  loginId: String!
  attendanceStatus: AttendanceStatus!
}

input UpdateSessionAttendanceNoteInput {
  sessionId: ID!
  loginId: String!
  note: String
}

input LoginInput {
  loginId: String!
  password: String!
}

input SignUpInput {
  loginId: String!
  password: String!
  name: String!
  nickname: String!
  part: Part!
  invitationCode: String!
}

input RefreshTokenInput {
  refreshToken: String!
}

enum Part {
  PM
  Designer
  Web
  iOS
  Android
  Flutter
  Server
}

enum Role {
  ROOT
  LEAD
  CHALLENGER
}

enum AttendanceStatus {
  PENDING
  ATTENDANCE
  LATE
  ABSENCE
  EXCUSED_ABSENCE
}
